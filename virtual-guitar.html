<title>Strung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif+Display&family=Libertinus+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#fff6ee;
    --cream-deep:#f6e9dc;
    --ink:#0d0a07;
    --brown:#8d663a;
    --brown-deep:#693a00;
    --watermark:rgba(105,58,0,0.10);
    --serif:'Libertinus Serif Display','Libertinus Serif',Georgia,serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--serif);
  }

  /* ---------- backdrop: soft silk folds on cream ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 55% 60% at 82% 18%, rgba(214,186,155,0.35), transparent 65%),
      radial-gradient(ellipse 45% 50% at 95% 65%, rgba(222,196,166,0.30), transparent 60%),
      radial-gradient(ellipse 70% 55% at 10% 90%, rgba(226,204,178,0.28), transparent 62%),
      radial-gradient(ellipse 60% 45% at 40% 0%, rgba(255,252,247,0.9), transparent 70%),
      var(--cream);
  }
  .backdrop::after{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 30% 45% at 70% 40%, rgba(255,255,255,0.55), transparent 70%),
      radial-gradient(ellipse 25% 35% at 88% 85%, rgba(255,255,255,0.4), transparent 70%);
    mix-blend-mode:soft-light;
  }

  .grain{
    position:fixed; inset:0; z-index:6;
    pointer-events:none;
    opacity:.035;
    mix-blend-mode:multiply;
  }

  #wave-canvas{
    position:fixed; inset:0; z-index:1;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* ---------- fixed-composition stage (1280x832, scaled to fit) ---------- */
  .stage{
    position:fixed;
    left:50%; top:50%;
    width:1280px; height:832px;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center center;
    z-index:2;
  }

  .acoustic{
    position:absolute;
    left:128px; top:96px;
    z-index:1;
    font-family:var(--serif);
    font-size:225px;
    line-height:195px;
    letter-spacing:-4.5px;
    color:var(--watermark);
    white-space:nowrap;
    user-select:none;
    pointer-events:none;
  }

  /* two-layer shadow: a large soft ambient pool offset well below the body
     (the gap between object and shadow is what reads as "lifted off the
     surface"), plus a tighter, darker core shadow close under the body for
     contrast -- without the core, a big soft shadow alone just looks hazy. */
  .guitar-shadow{
    position:absolute;
    left:-90px; top:465px;
    width:1140px; height:410px;
    z-index:2;
    background:radial-gradient(ellipse 52% 50% at 44% 38%, rgba(55,29,6,0.48), transparent 72%);
    filter:blur(62px);
    pointer-events:none;
  }
  .guitar-shadow-core{
    position:absolute;
    left:60px; top:432px;
    width:700px; height:190px;
    z-index:2;
    background:radial-gradient(ellipse 48% 50% at 45% 40%, rgba(38,19,4,0.42), transparent 68%);
    filter:blur(22px);
    pointer-events:none;
  }

  .guitar-wrap{
    position:absolute;
    left:104px; top:186px;
    width:1056px;
    z-index:3;
  }
  .guitar-wrap svg{
    width:100%; height:auto;
    overflow:visible;
    display:block;
  }
  #hit-layer{ cursor:grab; touch-action:none; }
  #hit-layer:active{ cursor:grabbing; }
  .live-string{ fill:none; stroke-linecap:round; }

  .copy{
    position:absolute;
    left:701px; top:555px;
    z-index:4;
    width:500px;
  }
  .overline-row{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .overline-row .label{
    font-family:var(--serif);
    font-size:24px;
    letter-spacing:-1.44px;
    color:var(--brown);
    white-space:nowrap;
  }
  .overline-row .rule{
    width:307px; height:1px;
    background:var(--brown);
    opacity:.75;
  }
  .headline{
    margin:10px 0 0;
    font-family:var(--serif);
    font-size:59.9px;
    line-height:52.7px;
    letter-spacing:-3.6px;
    color:#000;
    max-width:465px;
    text-wrap:balance;
  }

  /* ---------- on-page chord row ---------- */
  .chord-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:7px;
  }
  .chord-chip{
    font-family:var(--serif);
    font-size:14px;
    letter-spacing:-.1px;
    color:var(--brown-deep);
    background:transparent;
    border:1px solid rgba(141,102,58,.35);
    border-radius:999px;
    padding:5px 13px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
  }
  .chord-chip:hover{ border-color:var(--brown); transform:translateY(-1px); }
  .chord-chip:focus-visible{ outline:2px solid var(--brown); outline-offset:2px; }
  .chord-chip.active{
    background:var(--brown-deep);
    border-color:var(--brown-deep);
    color:var(--cream);
  }

  .key-hint{
    display:flex;
    align-items:center;
    gap:14px;
    font-family:var(--serif);
    font-style:italic;
    font-size:14px;
    color:rgba(13,10,7,.55);
    white-space:nowrap;
  }
  .key-hint .key-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .key-hint kbd{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 5px;
    border:1px solid rgba(141,102,58,.4);
    border-radius:5px;
    background:rgba(255,250,244,.7);
    font-family:'Libertinus Serif',serif;
    font-style:normal;
    font-size:13px;
    color:var(--brown-deep);
    transition:background .12s ease, transform .1s ease;
  }
  .key-hint kbd.pressed{
    background:var(--brown-deep);
    color:var(--cream);
    transform:scale(.92);
  }

  /* ---------- footer bar: chords + strum-direction keys ---------- */
  .footer{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:9;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:22px;
    padding:16px 28px;
    border-top:1px solid rgba(141,102,58,.18);
    background:rgba(255,250,244,.74);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .footer-divider{
    width:1px; height:20px;
    background:rgba(141,102,58,.25);
  }

  @media (max-width: 560px){
    .footer{ gap:12px; padding:12px 16px; }
    .footer-divider{ display:none; }
  }

  /* ---------- floating note labels ---------- */
  .note-float{
    position:fixed;
    z-index:7;
    font-family:var(--serif);
    font-style:italic;
    font-size:22px;
    color:var(--brown);
    pointer-events:none;
    animation:noteRise 1.15s ease-out forwards;
  }
  .note-float sub{ font-size:.55em; }
  @keyframes noteRise{
    0%{ opacity:0; transform:translate(-50%,0) scale(.85); }
    12%{ opacity:.9; }
    100%{ opacity:0; transform:translate(-50%,-56px) scale(1.05); }
  }

  /* ---------- play button (pick-shaped) + popup panel ---------- */
  .play-btn{
    position:fixed;
    right:34px; top:24px;
    z-index:11;
    width:76px; height:90px;
    padding:0; border:none; background:none; cursor:pointer;
    filter:drop-shadow(0 10px 20px rgba(105,58,0,.32));
    transition:transform .18s ease, filter .2s ease;
  }
  .play-btn:hover{ transform:translateY(-2px) scale(1.03); }
  .play-btn:focus-visible{ outline:2px solid var(--brown-deep); outline-offset:4px; }
  .play-btn.open{ transform:rotate(10deg); }
  .play-btn.open:hover{ transform:rotate(10deg) translateY(-2px); }
  .play-btn-pick{ position:absolute; inset:0; width:100%; height:100%; }
  .play-btn-label{
    position:absolute;
    left:50%; top:31%;
    transform:translate(-50%,-50%);
    font-family:var(--serif);
    font-weight:600;
    font-size:14px;
    letter-spacing:.03em;
    color:var(--cream);
    pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.2);
  }

  .panel{
    position:fixed;
    right:28px; top:122px;
    z-index:10;
    width:296px;
    max-height:calc(100vh - 156px);
    overflow-y:auto;
    background:rgba(255,250,244,.94);
    border:1px solid rgba(141,102,58,.25);
    border-radius:14px;
    box-shadow:0 24px 50px rgba(80,45,10,.20);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transform-origin:top right;
    transition:opacity .2s ease, transform .2s ease;
  }
  .panel.hidden{
    opacity:0;
    transform:scale(.97) translateY(-6px);
    pointer-events:none;
  }

  .panel-section{ border-bottom:1px solid rgba(141,102,58,.16); }
  .panel-section:last-child{ border-bottom:none; }
  .panel-section > summary{
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 18px;
    font-family:'Libertinus Serif',serif;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brown-deep);
    cursor:pointer;
    user-select:none;
  }
  .panel-section > summary::-webkit-details-marker{ display:none; }
  .panel-section > summary::after{
    content:'';
    width:7px; height:7px;
    border-right:1.5px solid var(--brown);
    border-bottom:1.5px solid var(--brown);
    transform:rotate(45deg);
    transition:transform .18s ease;
  }
  .panel-section[open] > summary::after{ transform:rotate(-135deg); }

  .panel-body{
    display:flex; flex-direction:column; gap:12px;
    padding:2px 18px 16px;
  }
  .panel-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px;
  }
  .panel-row > span{
    font-family:var(--serif);
    font-size:14.5px;
    color:var(--ink);
    white-space:nowrap;
  }
  .panel-row .panel-control{
    display:flex; align-items:center; gap:8px;
    flex:0 0 auto;
  }

  .panel-select{
    font-family:var(--serif);
    font-size:14px;
    color:var(--brown-deep);
    background:var(--cream-deep);
    border:1px solid rgba(141,102,58,.35);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .panel-select:focus-visible{ outline:2px solid var(--brown); }

  .panel-action{
    width:100%;
    font-family:var(--serif);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.02em;
    color:var(--cream);
    background:var(--brown-deep);
    border:none;
    border-radius:8px;
    padding:10px 0;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .panel-action:hover{ background:#4d2a00; }
  .panel-action:focus-visible{ outline:2px solid var(--brown-deep); outline-offset:2px; }
  .panel-action.playing{ animation:actionPlay .3s ease; }
  @keyframes actionPlay{
    0%{ transform:scale(1); }
    40%{ transform:scale(.97); background:var(--brown); }
    100%{ transform:scale(1); }
  }

  .switch{
    position:relative;
    width:36px; height:21px;
    flex:0 0 auto;
  }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .switch .track{
    position:absolute; inset:0;
    background:rgba(141,102,58,.3);
    border-radius:999px;
    transition:background .18s ease;
  }
  .switch .track::after{
    content:'';
    position:absolute; left:2px; top:2px;
    width:17px; height:17px;
    border-radius:50%;
    background:var(--cream);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:transform .18s ease;
  }
  .switch input:checked + .track{ background:var(--brown-deep); }
  .switch input:checked + .track::after{ transform:translateX(15px); }
  .switch input:focus-visible + .track{ outline:2px solid var(--brown); outline-offset:2px; }

  .panel-slider{
    -webkit-appearance:none; appearance:none;
    width:110px; height:3px;
    background:rgba(141,102,58,.3);
    border-radius:999px;
    cursor:pointer;
  }
  .panel-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--brown-deep);
    cursor:pointer;
  }
  .panel-slider::-moz-range-thumb{
    width:14px; height:14px; border:none;
    border-radius:50%;
    background:var(--brown-deep);
    cursor:pointer;
  }
  .panel-readout{
    font-family:'Libertinus Serif',serif;
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    color:var(--brown);
    width:26px;
    text-align:right;
  }

  @media (max-width: 560px){
    .play-btn{ right:16px; top:14px; width:62px; height:74px; }
    .play-btn-label{ font-size:12px; }
    .panel{ right:16px; top:98px; width:min(88vw, 300px); }
  }

  @media (prefers-reduced-motion: reduce){
    .note-float{ animation-duration:.4s; }
  }

  /* ---------- landscape-only gate for phones ---------- */
  /* the guitar is drawn horizontal and needs real width to play well --
     on a narrow phone screen in portrait it just doesn't work, so ask for
     a turn instead of rendering a cramped, unplayable version. */
  .rotate-gate{ display:none; }
  @media (max-width: 900px) and (orientation: portrait){
    .rotate-gate{
      display:flex;
      position:fixed; inset:0; z-index:100;
      flex-direction:column; align-items:center; justify-content:center;
      gap:16px;
      background:var(--cream);
      text-align:center;
      padding:12vh 12vw;
    }
    .backdrop, #wave-canvas, .grain, .stage, .hint, .footer, .play-btn, .panel{
      display:none;
    }
  }
  .rotate-gate-icon{ animation:rotateHint 1.8s ease-in-out infinite; }
  .rotate-gate h2{
    margin:0;
    font-family:var(--serif);
    font-size:24px;
    letter-spacing:-.5px;
    color:var(--brown-deep);
  }
  .rotate-gate p{
    margin:0;
    font-family:'Libertinus Serif',serif;
    font-style:italic;
    font-size:15px;
    color:rgba(13,10,7,.6);
    max-width:36ch;
  }
  @keyframes rotateHint{
    0%,15%{ transform:rotate(0deg); }
    45%,65%{ transform:rotate(90deg); }
    95%,100%{ transform:rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .rotate-gate-icon{ animation:none; }
  }
</style>

<div class="backdrop"></div>

<div class="rotate-gate" role="alert">
  <svg class="rotate-gate-icon" width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="15" y="4" width="22" height="44" rx="4" stroke="#693a00" stroke-width="2.5"/>
    <circle cx="26" cy="40" r="1.4" fill="#693a00"/>
  </svg>
  <h2>Turn your phone sideways</h2>
  <p>Strung is a horizontal instrument &mdash; it needs landscape to play properly.</p>
</div>

<canvas id="wave-canvas"></canvas>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">

    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix type="saturate" values="0"></feColorMatrix>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"></rect>
</svg>

      <path transform="matrix(.62234 0 0 .62234 67.472 34.804)" d="m151.9 90.943c0 0.53697-0.4353 0.97227-0.97227 0.97227s-0.97227-0.4353-0.97227-0.97227 0.4353-0.97227 0.97227-0.97227 0.97227 0.4353 0.97227 0.97227z" fill="url(#b)"/>
      <path transform="matrix(.62234 0 0 -.62234 67.472 153.45)" d="m151.9 90.943c0 0.53697-0.4353 0.97227-0.97227 0.97227s-0.97227-0.4353-0.97227-0.97227 0.4353-0.97227 0.97227-0.97227 0.97227 0.4353 0.97227 0.97227z" fill="url(#b)"/>
      <path transform="matrix(.62234 0 0 -.62234 56.998 153.45)" d="m151.9 90.943c0 0.53697-0.4353 0.97227-0.97227 0.97227s-0.97227-0.4353-0.97227-0.97227 0.4353-0.97227 0.97227-0.97227 0.97227 0.4353 0.97227 0.97227z" fill="url(#b)"/>
      <path transform="matrix(.62234 0 0 -.62234 62.168 153.25)" d="m151.9 90.943c0 0.53697-0.4353 0.97227-0.97227 0.97227s-0.97227-0.4353-0.97227-0.97227 0.4353-0.97227 0.97227-0.97227 0.97227 0.4353 0.97227 0.97227z" fill="url(#b)"/>

      <!-- live physics strings replace the six static spans -->
      <g id="live-strings"></g>

<script>
(function(){
  "use strict";

  /* ================= stage scaling ================= */
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(innerWidth/1280, innerHeight/832);
    stage.style.transform = 'translate(-50%,-50%) scale('+s+')';
  }
  window.addEventListener('resize', fit);
  fit();

  // the rotate-gate (see CSS) hides the whole instrument on narrow portrait
  // screens -- skip the animation work behind it too, not just the pixels.
  var gateQuery = window.matchMedia('(max-width: 900px) and (orientation: portrait)');
  function isGateActive(){ return gateQuery.matches; }

  /* ================= string data (SVG user units) ================= */
  var X0 = 50.94, X1 = 145.03; // bridge -> nut
  var STRINGS = [
    { note:'E2', freq:82.41,  y0:90.34, y1:91.56, w:0.52, wound:true  },
    { note:'A2', freq:110.00, y0:91.90, y1:92.59, w:0.45, wound:true  },
    { note:'D3', freq:146.83, y0:93.47, y1:93.53, w:0.38, wound:true  },
    { note:'G3', freq:196.00, y0:95.02, y1:94.64, w:0.30, wound:false },
    { note:'B3', freq:246.94, y0:96.60, y1:95.67, w:0.25, wound:false },
    { note:'E4', freq:329.63, y0:98.16, y1:96.69, w:0.21, wound:false }
  ];

  var svg = document.getElementById('guitar-svg');
  var liveG = document.getElementById('live-strings');
  var hit = document.getElementById('hit-layer');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lerp(a,b,t){ return a+(b-a)*t; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function yAt(i,u){ var s=STRINGS[i]; return lerp(s.y0, s.y1, u); }
  function uFromX(x){ return clamp((x-X0)/(X1-X0), 0.03, 0.97); }
  function fretFreq(i, fret){ return STRINGS[i].freq * Math.pow(2, fret/12); }

  /* ================= chords ================= */
  /* fret per string, low E -> high E; null = muted (skipped when strumming) */
  var CHORDS = [
    { name:'Open', frets:[0,0,0,0,0,0] },
    { name:'E',    frets:[0,2,2,1,0,0] },
    { name:'Em',   frets:[0,2,2,0,0,0] },
    { name:'A',    frets:[null,0,2,2,2,0] },
    { name:'Am',   frets:[null,0,2,2,1,0] },
    { name:'D',    frets:[null,null,0,2,3,2] },
    { name:'Dm',   frets:[null,null,0,2,3,1] },
    { name:'G',    frets:[3,2,0,0,0,3] },
    { name:'C',    frets:[null,3,2,0,1,0] },
    { name:'F',    frets:[1,3,3,2,1,1] },
    { name:'B',    frets:[null,2,4,4,4,2] }
  ];
  var currentChord = 0;
  function chordFret(i){ return CHORDS[currentChord].frets[i]; }

  var stringEls = STRINGS.map(function(s){
    var glow = document.createElementNS(svg.namespaceURI,'path');
    glow.setAttribute('class','live-string');
    glow.setAttribute('stroke', s.wound ? '#a5813f' : '#8f8468');
    glow.setAttribute('stroke-width', s.w+0.9);
    glow.setAttribute('opacity','0');
    liveG.appendChild(glow);

    var main = document.createElementNS(svg.namespaceURI,'path');
    main.setAttribute('class','live-string');
    main.setAttribute('stroke', s.wound ? '#8a7146' : '#9b917b');
    main.setAttribute('stroke-width', s.w);
    liveG.appendChild(main);

    return { glow:glow, main:main };
  });

  /* ================= audio: Karplus-Strong ================= */
  // Every pluck used to synthesize its ~2.6s buffer synchronously on the
  // main thread at the exact moment it was triggered -- for the very first
  // note that meant building the AudioContext, the reverb impulse response
  // (2 channels x ~115k samples), AND the string's own buffer all in one
  // blocking burst right when the user expected instant sound, plus every
  // fresh pitch after that paid the same synthesis cost again. That's the
  // "doesn't play properly at the start" glitch. Fixed by: creating the
  // context immediately (silently -- browsers allow this, they just block
  // actual output until a real gesture resumes it), building the reverb
  // IR and a small pool of pre-rendered open-string buffers during idle
  // time after load, and caching every buffer per (string, pitch) so nothing
  // synthesizes twice. The only thing left on the interactive path is
  // resume() + picking a cached buffer -- both effectively instant.
  var muted=false, masterVolume=0.9;
  var actx=null, masterGain, analyser, convolver, reverbGain, dryGain;
  var PLUCK_POOL_SIZE = 3;
  var pluckCache = {};

  function ensureAudio(){
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain(); masterGain.gain.value = muted?0:masterVolume;
    analyser = actx.createAnalyser(); analyser.fftSize = 1024;
    convolver = actx.createConvolver();
    reverbGain = actx.createGain(); reverbGain.gain.value = 0.22;
    dryGain = actx.createGain(); dryGain.gain.value = 1.0;
    dryGain.connect(masterGain);
    convolver.connect(reverbGain); reverbGain.connect(masterGain);
    masterGain.connect(analyser); analyser.connect(actx.destination);
  }

  function makeReverbIR(duration, decayPow){
    var sr = actx.sampleRate, len = Math.floor(sr*duration);
    var ir = actx.createBuffer(2, len, sr);
    for (var ch=0; ch<2; ch++){
      var data = ir.getChannelData(ch);
      for (var i=0;i<len;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/len, decayPow);
    }
    return ir;
  }

  function karplusStrong(freq, seconds, decay, damping){
    var sr = actx.sampleRate;
    var N = Math.max(2, Math.round(sr/freq));
    var buf = new Float32Array(N);
    for (var i=0;i<N;i++) buf[i] = Math.random()*2-1;
    var total = Math.floor(sr*seconds);
    var out = new Float32Array(total);
    var idx=0, lp=0;
    for (var n=0;n<total;n++){
      var cur = buf[idx];
      var nextIdx = (idx+1)%N;
      var avg = 0.5*(cur+buf[nextIdx]);
      lp = avg*(1-damping) + lp*damping;
      buf[idx] = decay*lp;
      out[n] = cur;
      idx = nextIdx;
    }
    var fadeIn = Math.min(64,total);
    for (var k=0;k<fadeIn;k++) out[k] *= k/fadeIn;
    return out;
  }

  var STRING_TONE = [
    { decay:0.9975, damping:0.34 },
    { decay:0.9975, damping:0.30 },
    { decay:0.9973, damping:0.24 },
    { decay:0.9970, damping:0.18 },
    { decay:0.9968, damping:0.14 },
    { decay:0.9965, damping:0.10 }
  ];

  // lazily builds (and reuses) up to PLUCK_POOL_SIZE pre-rendered variations
  // per exact pitch, so repeated strums of the same note stay varied
  // ("nothing rings quite the same way twice") without re-synthesizing.
  function getPluckBuffer(i, freq){
    var key = i+'_'+Math.round(freq*10);
    var arr = pluckCache[key] || (pluckCache[key] = []);
    if (arr.length < PLUCK_POOL_SIZE){
      var tone = STRING_TONE[i];
      var data = karplusStrong(freq, 2.6, tone.decay, tone.damping);
      var buf = actx.createBuffer(1, data.length, actx.sampleRate);
      buf.copyToChannel(data, 0);
      arr.push(buf);
      return buf;
    }
    return arr[(Math.random()*arr.length)|0];
  }

  // heavy, non-urgent setup: the reverb tail and a warmed cache of every
  // open string's buffer. Runs once, shortly after load, while the page is
  // idle -- well before a real user has moved the mouse onto the guitar.
  var audioWarmed = false;
  function warmUpAudio(){
    if (audioWarmed) return;
    audioWarmed = true;
    ensureAudio();
    convolver.buffer = makeReverbIR(2.6, 3.2);
    // fill every pool slot (not just one) so open strings -- by far the
    // default, most-played case -- never hit the synchronous path at all,
    // no matter how many times in a row they're plucked.
    for (var i=0;i<STRINGS.length;i++){
      for (var v=0; v<PLUCK_POOL_SIZE; v++) getPluckBuffer(i, STRINGS[i].freq);
    }
  }
  function scheduleIdle(fn){
    if (window.requestIdleCallback) requestIdleCallback(fn, {timeout:1500});
    else setTimeout(fn, 300);
  }
  scheduleIdle(warmUpAudio);

  function playPluckSound(i, amp01, freq){
    ensureAudio();
    if (!convolver.buffer) convolver.buffer = makeReverbIR(2.6, 3.2); // in case idle warm-up hasn't run yet
    if (actx.state==='suspended') actx.resume();
    var vel = clamp(amp01, 0.12, 1);
    var buffer = getPluckBuffer(i, freq || STRINGS[i].freq);
    var src = actx.createBufferSource(); src.buffer = buffer;
    var gain = actx.createGain(); gain.gain.value = 0.55*vel;
    var pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
    if (pan) pan.pan.value = clamp((i-2.5)/3.2, -0.6, 0.6);
    src.connect(gain);
    if (pan){ gain.connect(pan); pan.connect(dryGain); pan.connect(convolver); }
    else { gain.connect(dryGain); gain.connect(convolver); }
    src.onended = function(){
      try{ src.disconnect(); gain.disconnect(); if (pan) pan.disconnect(); }catch(_e){}
    };
    src.start();
  }

  function applyVolume(){
    if (!actx) return;
    masterGain.gain.setTargetAtTime(muted?0:masterVolume, actx.currentTime, 0.05);
  }

  /* ================= visual physics ================= */
  var VFREQ = [9.5,10.5,11.6,12.8,14.0,15.4];
  var VDAMP = [1.15,1.35,1.6,1.95,2.3,2.7];
  var MAXAMP = 4.2;

  var activeStrings = {};
  var heldIndex=null, heldOffset=0, heldU=0.5;
  var lastPointer=null, lastCross={}, lastBand=null;

  function triggerString(i, amp, dir, freq){
    amp = clamp(Math.abs(amp), 0.8, MAXAMP);
    activeStrings[i] = { t0:performance.now(), amp:amp, dir:dir||1 };
    playPluckSound(i, amp/MAXAMP, freq);
    spawnNote(i);
  }

  function renderStrings(){
    if (isGateActive()){ requestAnimationFrame(renderStrings); return; }
    var now = performance.now(), N=24;
    for (var i=0;i<STRINGS.length;i++){
      var st = activeStrings[i];
      var pts=[], ringing=false, env=0, t=0;
      if (st){
        t = (now-st.t0)/1000;
        env = st.amp*Math.exp(-VDAMP[i]*t);
        if (env>0.03) ringing=true; else delete activeStrings[i];
      }
      for (var k=0;k<=N;k++){
        var u=k/N;
        var x=lerp(X0,X1,u), y=yAt(i,u), dy=0;
        if (ringing){
          var shape = Math.sin(Math.PI*u);
          var harmonic = 0.28*Math.sin(2*Math.PI*u)*Math.exp(-t*2.4);
          dy = st.dir*env*(shape+harmonic)*Math.cos(2*Math.PI*VFREQ[i]*t);
        } else if (heldIndex===i){
          var peak = (u<=heldU)?(u/heldU):((1-u)/(1-heldU));
          dy = heldOffset*peak;
        }
        pts.push(x.toFixed(2)+','+(y+dy).toFixed(2));
      }
      var d='M'+pts.join(' L');
      var el=stringEls[i];
      el.main.setAttribute('d',d);
      el.glow.setAttribute('d',d);
      el.glow.setAttribute('opacity', ringing ? clamp(env/MAXAMP,0,0.4).toFixed(2) : '0');
    }
    requestAnimationFrame(renderStrings);
  }
  requestAnimationFrame(renderStrings);

  /* ================= pointer interaction ================= */
  // the guitar artwork sits inside <g transform="translate(-4.5946 -5.5458)">,
  // drawn using the original SVG's raw path numbers -- STRINGS/X0/X1/hit-layer
  // are all specified in that same raw space. getScreenCTM() on the outer
  // <svg>, though, maps screen <-> the viewBox's space, one step outside that
  // group. every pointer coordinate has to be shifted back into raw space
  // before it can be compared against a string's position, or every hover
  // reads several units off from where the strings actually are.
  var GX = 4.5946, GY = 5.5458;

  function svgPoint(evt){
    var pt = svg.createSVGPoint();
    pt.x=evt.clientX; pt.y=evt.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm || ctm.a===0) return null; // page not laid out / hidden tab
    var p = pt.matrixTransform(ctm.inverse());
    return { x: p.x + GX, y: p.y + GY };
  }

  function nearestString(x,y){
    var u=uFromX(x), best=-1, bestD=1e9;
    for (var i=0;i<STRINGS.length;i++){
      var d=Math.abs(yAt(i,u)-y);
      if (d<bestD){ bestD=d; best=i; }
    }
    return { i:best, d:bestD, u:u };
  }

  // strings sit close together, so "did the cursor cross this exact line"
  // is too strict for a hover gesture -- a small, fast, or slightly-off
  // movement can skip a string entirely. instead, divide the span into one
  // band per string (boundary = midpoint to its neighbor) and trigger every
  // band the cursor moves through, so a single wave of the hand always
  // reaches all six.
  function bandAt(y,u){
    for (var i=0;i<STRINGS.length;i++){
      var lo = i===0 ? -1e9 : (yAt(i-1,u)+yAt(i,u))/2;
      var hi = i===STRINGS.length-1 ? 1e9 : (yAt(i,u)+yAt(i+1,u))/2;
      if (y>=lo && y<hi) return i;
    }
    return -1;
  }

  function onDown(evt){
    ensureAudio();
    if (actx.state==='suspended') actx.resume();
    try{ hit.setPointerCapture(evt.pointerId); }catch(_e){}
    var p=svgPoint(evt);
    if (!p) return;
    var near=nearestString(p.x,p.y);
    lastPointer=p; lastCross={}; lastBand=bandAt(p.y,near.u);
    if (near.d<1.1 && !activeStrings[near.i]){
      heldIndex=near.i;
      heldU=clamp(near.u,0.12,0.88);
      heldOffset=clamp(p.y-yAt(near.i,heldU),-4,4);
    } else { heldIndex=null; heldOffset=0; }
  }

  // pointermove doubles as the hover-strum driver: it needs no button held.
  // the very first sample after entry rings whichever string the cursor
  // lands on directly (first contact should sound, same as any other
  // string), then becomes the baseline that later crossings compare against.
  function onMove(evt){
    var p=svgPoint(evt);
    if (!p) return;
    if (lastPointer===null){
      lastPointer=p;
      var u0=uFromX(p.x);
      var band0=bandAt(p.y,u0);
      lastBand=band0;
      if (band0!==-1 && band0!==heldIndex){
        var fret0=chordFret(band0);
        if (fret0!==null) triggerString(band0, 1.6, 1, fretFreq(band0,fret0));
      }
      return;
    }

    if (heldIndex!==null){
      heldU=clamp(uFromX(p.x),0.12,0.88);
      heldOffset=clamp(p.y-yAt(heldIndex,heldU),-4,4);
    }

    var u=uFromX(p.x);
    var curBand=bandAt(p.y,u);
    var speed=Math.hypot(p.x-lastPointer.x,p.y-lastPointer.y);
    var amp=clamp(speed*1.4, 1.2, MAXAMP);
    var now=performance.now();

    if (curBand!==-1 && lastBand!==null && lastBand!==-1 && curBand!==lastBand){
      var dir = curBand>lastBand ? 1 : -1;
      for (var b=lastBand+dir; ; b+=dir){
        if (b===heldIndex){ if (b===curBand) break; else continue; }
        var fret=chordFret(b);
        if (fret!==null && (!lastCross[b]||now-lastCross[b]>110)){
          triggerString(b, amp, dir, fretFreq(b,fret));
          lastCross[b]=now;
        }
        if (b===curBand) break;
      }
    }
    lastBand = curBand===-1 ? lastBand : curBand;
    lastPointer=p;
  }

  function onUp(){
    if (heldIndex!==null){
      var i=heldIndex;
      if (Math.abs(heldOffset)>0.45){
        triggerString(i, Math.abs(heldOffset)*1.15, heldOffset>0?-1:1);
      } else {
        triggerString(i, 1.8, Math.random()<0.5?1:-1);
      }
    }
    heldIndex=null; heldOffset=0;
  }

  hit.addEventListener('pointerdown', onDown);
  hit.addEventListener('pointermove', onMove);
  hit.addEventListener('pointerup', onUp);
  hit.addEventListener('pointercancel', onUp);
  hit.addEventListener('pointerleave', function(evt){
    if (evt.buttons===0) onUp();
    lastPointer=null; lastBand=null; // re-baseline on next entry instead of reading a jump
  });

  function pulseKbd(id){
    var k=document.getElementById(id);
    if (!k) return;
    k.classList.remove('pressed'); void k.offsetWidth;
    k.classList.add('pressed');
    setTimeout(function(){ k.classList.remove('pressed'); }, 160);
  }

  window.addEventListener('keydown', function(e){
    var n=parseInt(e.key,10);
    if (n>=1 && n<=6){
      ensureAudio();
      if (actx.state==='suspended') actx.resume();
      var i=6-n, fret=chordFret(i);
      triggerString(i, 2.2, Math.random()<0.5?1:-1, fret===null?null:fretFreq(i,fret));
      return;
    }
    if (e.key === 'ArrowDown'){
      e.preventDefault();
      wake();
      pulseKbd('kbd-down');
      sweepStrum('D', 2.6);
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      wake();
      pulseKbd('kbd-up');
      sweepStrum('U', 2.6);
    }
  });

  /* ================= audio unlock ================= */
  // first real user gesture (click, keypress) starts/resumes the audio
  // context -- browsers won't allow hover alone to do this, so the very
  // first hover-only pluck may be silent until one of those happens.
  function wake(){
    ensureAudio();
    if (actx.state==='suspended') actx.resume();
  }

  /* ================= play button + popup panel ================= */
  var playBtn = document.getElementById('play-btn');
  var panel = document.getElementById('panel');
  var panelOpen = false;

  function setPanelOpen(open){
    panelOpen = open;
    panel.classList.toggle('hidden', !open);
    playBtn.classList.toggle('open', open);
    playBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  playBtn.addEventListener('click', function(){
    wake();
    setPanelOpen(!panelOpen);
  });

  document.addEventListener('pointerdown', function(evt){
    if (!panelOpen) return;
    if (panel.contains(evt.target) || playBtn.contains(evt.target)) return;
    setPanelOpen(false);
  });

  document.addEventListener('keydown', function(evt){
    if (evt.key === 'Escape' && panelOpen) setPanelOpen(false);
  });

  var chordRow = document.getElementById('chord-row');
  CHORDS.forEach(function(c, idx){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chord-chip' + (idx===0 ? ' active' : '');
    b.textContent = c.name;
    b.addEventListener('click', function(){
      wake();
      currentChord = idx;
      chordRow.querySelectorAll('.chord-chip').forEach(function(el){ el.classList.remove('active'); });
      b.classList.add('active');
    });
    chordRow.appendChild(b);
  });

  var muteToggle = document.getElementById('mute-toggle');
  muteToggle.addEventListener('change', function(){
    wake();
    muted = muteToggle.checked;
    applyVolume();
  });

  var volumeSlider = document.getElementById('volume-slider');
  var volumeReadout = document.getElementById('volume-readout');
  volumeSlider.addEventListener('input', function(){
    wake();
    masterVolume = volumeSlider.value/100;
    volumeReadout.textContent = volumeSlider.value;
    applyVolume();
  });

  function sweepStrum(direction, velocity){
    var order = direction==='D' ? [0,1,2,3,4,5] : [5,4,3,2,1,0];
    order.forEach(function(i, idx){
      var fret=chordFret(i);
      if (fret===null) return;
      setTimeout(function(){
        var amp = velocity*(0.85+Math.random()*0.3);
        triggerString(i, amp, direction==='D'?1:-1, fretFreq(i,fret));
      }, idx*15);
    });
  }

  // basic single down/up strokes now live on the arrow keys -- this list is
  // just the fancier named patterns, reachable from the Play panel.
  var STRUM_PATTERNS = {
    Pop:    { steps:[{d:'D'},{d:'D'},null,{d:'U'},null,{d:'U'},{d:'D'},{d:'U'}], step:190 },
    Ballad: { steps:[{d:'D'},null,{d:'D'},null,{d:'D'},null,{d:'D'},null], step:210 },
    Waltz:  { steps:[{d:'D'},null,null,{d:'U'},null,{d:'U'}], step:230 }
  };

  function playPattern(name, btn){
    wake();
    var pat=STRUM_PATTERNS[name];
    pat.steps.forEach(function(step, idx){
      if (!step) return;
      setTimeout(function(){ sweepStrum(step.d, 2.7); }, idx*pat.step);
    });
    if (btn){
      btn.classList.remove('playing'); void btn.offsetWidth;
      btn.classList.add('playing');
      setTimeout(function(){ btn.classList.remove('playing'); }, pat.steps.length*pat.step + 260);
    }
  }

  var patternSelect = document.getElementById('pattern-select');
  Object.keys(STRUM_PATTERNS).forEach(function(name){
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    patternSelect.appendChild(opt);
  });

  var playPatternBtn = document.getElementById('play-pattern-btn');
  playPatternBtn.addEventListener('click', function(){
    playPattern(patternSelect.value, playPatternBtn);
  });

  /* ================= floating note labels ================= */
  function spawnNote(i){
    var s=STRINGS[i];
    var pt=svg.createSVGPoint();
    pt.x=(X1-4)-GX; pt.y=s.y1-GY;
    var sp=pt.matrixTransform(svg.getScreenCTM());
    var el=document.createElement('div');
    el.className='note-float';
    el.innerHTML = s.note[0]+'<sub>'+s.note[1]+'</sub>';
    el.style.left=sp.x+'px';
    el.style.top=(sp.y-26)+'px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1200);
  }

  /* ================= background wave canvas ================= */
  var canvas=document.getElementById('wave-canvas');
  var ctx=canvas.getContext('2d');
  var motes=[];
  var DPR=Math.min(2, window.devicePixelRatio||1);

  function resize(){
    canvas.width=innerWidth*DPR; canvas.height=innerHeight*DPR;
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  }
  window.addEventListener('resize', resize);
  resize();

  if (!reduceMotion){
    for (var m=0;m<38;m++){
      motes.push({
        x:Math.random(), y:Math.random(),
        r:0.6+Math.random()*1.6,
        speed:0.00005+Math.random()*0.00012,
        drift:(Math.random()-0.5)*0.00005,
        phase:Math.random()*Math.PI*2,
        baseAlpha:0.05+Math.random()*0.12
      });
    }
  }

  var guitarWrapEl = document.querySelector('.guitar-wrap');
  function guitarCenterScreen(){
    var r = guitarWrapEl.getBoundingClientRect();
    return { x:r.x+r.width/2, y:r.y+r.height/2, width:r.width };
  }

  var timeDomain=new Uint8Array(1024);

  function drawWaves(t){
    if (isGateActive()){ requestAnimationFrame(drawWaves); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for (var m2=0;m2<motes.length;m2++){
      var mt=motes[m2];
      mt.y-=mt.speed; mt.x+=mt.drift;
      if (mt.y<-0.05) mt.y=1.05;
      if (mt.x<-0.05) mt.x=1.05; if (mt.x>1.05) mt.x=-0.05;
      var flicker=0.7+0.3*Math.sin(t*0.001+mt.phase);
      ctx.beginPath();
      ctx.fillStyle='rgba(141,102,58,'+(mt.baseAlpha*flicker).toFixed(3)+')';
      ctx.arc(mt.x*canvas.width, mt.y*canvas.height, mt.r*DPR, 0, Math.PI*2);
      ctx.fill();
    }

    // a single waveform ribbon, centered on the guitar (behind it, since
    // this canvas sits below the guitar in z-index) instead of pinned to
    // a screen edge -- it's the guitar's own voice, so it lives with it.
    if (analyser && !reduceMotion){
      analyser.getByteTimeDomainData(timeDomain);
      var gc = guitarCenterScreen();
      var cy = gc.y*DPR;
      var waveWidth = canvas.width;
      var cx0 = 0;
      ctx.beginPath();
      for (var k=0;k<timeDomain.length;k+=4){
        var vx=cx0+(k/timeDomain.length)*waveWidth;
        var vv=(timeDomain[k]-128)/128;
        var vy=cy+vv*46*DPR;
        if (k===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
      }
      ctx.strokeStyle='rgba(105,58,0,0.16)';
      ctx.lineWidth=1.4*DPR;
      ctx.stroke();
    }

    requestAnimationFrame(drawWaves);
  }
  requestAnimationFrame(drawWaves);

})();
</script>
