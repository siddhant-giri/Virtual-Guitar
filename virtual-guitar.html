<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Strung &mdash; play five instruments</title>
<meta
  name="description"
  content="Strung -- a playable virtual instrument stage. Hover, strum, bow, and strike your way through a guitar, bass, violin, xylophone, and keyboard, each with real physics, a hand-tuned synthesis engine, and its own preset songs."
/>
<meta name="theme-color" content="#fff6ee" />
<meta property="og:title" content="Strung -- play five instruments" />
<meta
  property="og:description"
  content="A playable virtual instrument stage: guitar, bass, violin, xylophone, and keyboard, each with real physics and its own sound."
/>
<meta property="og:type" content="website" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Libertinus+Serif+Display&family=Libertinus+Serif:ital@0;1&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/shared.css?v=7" />
</head>
<body>
  <div class="sg-backdrop"></div>
  <canvas id="sg-motes"></canvas>

  <svg class="sg-grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="sgNoiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="100%" height="100%" filter="url(#sgNoiseFilter)"></rect>
  </svg>

  <div class="sg-rotate-gate" role="alert">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" class="sg-rotate-gate-icon">
      <rect x="15" y="4" width="22" height="44" rx="4" stroke="#693a00" stroke-width="2.5" />
      <circle cx="26" cy="40" r="1.4" fill="#693a00" />
    </svg>
    <h2>Turn your phone sideways</h2>
    <p>These instruments are drawn wide &mdash; landscape is where they play properly.</p>
  </div>

      />
    </svg>
  </a>

  <div id="sg-music-player" class="sg-music-player sg-music-player--empty">
    <div id="sg-music-dropdown" class="sg-music-dropdown">
      <button
        id="sg-music-dropdown-btn"
        class="sg-music-dropdown-btn"
        type="button"
        aria-haspopup="listbox"
        aria-expanded="false"
        disabled
      >
        <span id="sg-music-dropdown-label" class="sg-music-dropdown-label">&mdash;</span>
        <svg class="sg-music-dropdown-caret" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <ul id="sg-music-dropdown-list" class="sg-music-dropdown-list" role="listbox" aria-label="Preset song"></ul>
    </div>
    <button id="sg-music-play" class="sg-music-play" type="button" aria-label="Play preset song" disabled>
      <svg class="sg-music-play-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 2.5v11l10-5.5-10-5.5Z" fill="currentColor" />
      </svg>
      <svg class="sg-music-pause-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor" />
        <rect x="9.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor" />
      </svg>
    </button>
  </div>

  <div id="sg-audio-hint" class="sg-audio-hint">&#9834; Tap or press a key to enable sound</div>

  <div id="slider-tabs" role="tablist" aria-label="Choose an instrument"></div>

  <button id="slider-prev" class="sg-nav-btn" type="button" aria-label="Previous instrument">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button id="slider-next" class="sg-nav-btn" type="button" aria-label="Next instrument">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div id="slider-viewport">
    <div id="slider-track"></div>
  </div>

  <script>window.StrungInstruments = [];</script>
  <script src="js/audio-core.js?v=7"></script>
  <script src="js/stage-fx.js?v=7"></script>
  <script src="js/presets.js?v=7"></script>
  <script src="js/music-player.js?v=7"></script>
  <script src="js/instruments/guitar.js?v=7"></script>
  <script src="js/instruments/bass.js?v=7"></script>
  <script src="js/instruments/violin.js?v=7"></script>
  <script src="js/instruments/xylophone.js?v=7"></script>
  <script src="js/instruments/keyboard.js?v=7"></script>
  <script src="js/slider.js?v=7"></script>
</body>
</html>
